spring.application.name=boolstorev6

server.port=8080
spring.datasource.url=jdbc:h2:mem:bookstorev5;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
logging.level.root=INFO
logging.level.com.example.bookstorev5=INFO
logging.file.name=${user.home}/bookstorev6/logs/bookstorev6.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
app.admin.bootstrap-enabled=true
app.admin.username=admin
app.admin.password=${BOOKSTORE_ADMIN_PASSWORD:admin123}